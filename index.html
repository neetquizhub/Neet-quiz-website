<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Portal</title>
  <style>
    :root {
      --primary-color: #4a90e2;
      --success-color: #2ecc71;
      --error-color: #e74c3c;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 750px;
      padding: 32px;
      border-radius: var(--border-radius);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      display: none;
    }

    .container.active {
      display: block;
    }

    /* Loading Screen */
    #loading-view {
      text-align: center;
      font-size: 1.4rem;
      color: #666;
    }

    .spinner {
      border: 5px solid #f3f3f3;
      border-top: 5px solid var(--primary-color);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Question Typography */
    .question-header {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--primary-color);
      margin-bottom: 8px;
    }

    .question-text {
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 24px;
    }

    /* Image Container */
    #image-container {
      margin-bottom: 20px;
      text-align: center;
    }

    #question-image {
      max-width: 100%;
      max-height: 300px;
      border-radius: 8px;
      object-fit: contain;
    }

    /* Options */
    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .opt-btn {
      width: 100%;
      padding: 16px 20px;
      font-size: 1.15rem;
      text-align: left;
      background-color: #f8f9fa;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-color);
    }

    .opt-btn:hover:not(:disabled) {
      background-color: #e9ecef;
      border-color: #ced4da;
    }

    .opt-btn.correct {
      background-color: #d4edda !important;
      border-color: var(--success-color) !important;
      color: #155724;
      font-weight: bold;
    }

    .opt-btn.wrong {
      background-color: #f8d7da !important;
      border-color: var(--error-color) !important;
      color: #721c24;
    }

    .opt-btn:disabled {
      cursor: not-allowed;
    }

    /* Explanation Drawer */
    #explanation-box {
      background-color: #eef6fc;
      border-left: 4px solid var(--primary-color);
      padding: 18px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 24px;
      display: none;
      font-size: 1.1rem;
      line-height: 1.5;
    }

    /* Navigation Controls */
    .controls {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .action-btn {
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background-color: var(--primary-color);
      color: white;
      transition: opacity 0.2s ease;
    }

    .action-btn:hover {
      opacity: 0.9;
    }

    .submit-btn {
      background-color: var(--success-color);
    }

    /* Results Screen */
    .result-score {
      font-size: 2.2rem;
      font-weight: bold;
      text-align: center;
      margin: 20px 0;
      color: var(--primary-color);
    }

    .weak-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    #weak-list {
      list-style-type: square;
      padding-left: 24px;
      font-size: 1.1rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- 1. LOADING VIEW -->
  <div id="loading-view" class="container active">
    <div class="spinner"></div>
    <p>Loading Quiz Questions...</p>
  </div>

  <!-- 2. QUIZ VIEW -->
  <div id="quiz-view" class="container">
    <div class="question-header" id="question-counter">Question 1</div>
    <div class="question-text" id="question-title">Loading Question...</div>

    <div id="image-container" style="display: none;">
      <img id="question-image" src="" alt="Question Image" />
    </div>

    <div class="options-grid" id="options-container"></div>

    <div id="explanation-box">
      <strong>Explanation:</strong>
      <p id="explanation-text" style="margin-top: 6px;"></p>
    </div>

    <div class="controls">
      <button class="action-btn" onclick="nextQuestion()">Next Question</button>
      <button class="action-btn submit-btn" onclick="confirmSubmit()">Submit Quiz</button>
    </div>
  </div>

  <!-- 3. RESULT VIEW -->
  <div id="result-view" class="container">
    <h2 style="font-size: 2rem; text-align: center;">Quiz Results</h2>
    <div class="result-score" id="final-score">0 / 0</div>

    <div class="weak-title">Areas for Improvement:</div>
    <ul id="weak-list"></ul>
  </div>

  <script>
    const WEB_APP_URL = "YOUR_DEPLOYED_WEB_APP_URL"; // Replace with your Apps Script URL

    let activeQuestions = [];
    let userAnswers = {};
    let currentIndex = 0;

    // Helper to format image URLs from Google Drive if applicable
    function formatImageUrl(url) {
      if (!url) return "";
      return url.trim();
    }

    // Fetch Questions from Google Apps Script Web App
    async function initQuiz() {
      try {
        const response = await fetch(WEB_APP_URL);
        activeQuestions = await response.json();

        document.getElementById('loading-view').classList.remove('active');

        if (activeQuestions.length === 0) {
          alert("No questions found in Google Sheet.");
          return;
        }

        document.getElementById('quiz-view').classList.add('active');
        renderQuestion(currentIndex);
      } catch (error) {
        console.error("Error loading quiz:", error);
        document.getElementById('loading-view').innerHTML = "<p style='color:red;'>Failed to load quiz data. Check API URL.</p>";
      }
    }

    function renderQuestion(index) {
      const q = activeQuestions[index];
      
      document.getElementById('question-counter').innerText = `Question ${index + 1} of ${activeQuestions.length}`;
      document.getElementById('question-title').innerText = q.QuestionTitle || q.Question || `Question ${index + 1}`;

      // Handle Image Display
      const imgContainer = document.getElementById('image-container');
      const imgElem = document.getElementById('question-image');
      const processedImgUrl = formatImageUrl(q.ImageUrl);

      if (processedImgUrl !== "") {
        imgElem.src = processedImgUrl;
        imgContainer.style.display = "block";
      } else {
        imgContainer.style.display = "none";
      }

      // Render Options
      const optionsBox = document.getElementById('options-container');
      optionsBox.innerHTML = "";

      const options = [
        { text: q.OptionA, num: 1 },
        { text: q.OptionB, num: 2 },
        { text: q.OptionC, num: 3 },
        { text: q.OptionD, num: 4 }
      ];

      const userSelected = userAnswers[index];
      const correctNum = parseInt(q.CorrectAnswer);

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt.text || "";

        if (userSelected !== undefined) {
          btn.disabled = true;
          if (opt.num === correctNum) btn.classList.add('correct');
          if (opt.num === userSelected && userSelected !== correctNum) btn.classList.add('wrong');
        } else {
          btn.onclick = () => selectOption(opt.num, correctNum, q.Solution);
        }

        optionsBox.appendChild(btn);
      });

      // Handle Explanation Box
      const expDrawer = document.getElementById('explanation-box');
      if (userSelected !== undefined) {
        document.getElementById('explanation-text').innerText = q.Solution || "No detailed solution text provided for this question.";
        expDrawer.style.display = 'block';
      } else {
        expDrawer.style.display = 'none';
      }
    }

    // Instant Option Selection (without re-rendering entire component)
    function selectOption(selectedNum, correctNum, solution) {
      userAnswers[currentIndex] = selectedNum;

      const buttons = document.querySelectorAll('.opt-btn');
      buttons.forEach((btn, idx) => {
        const optionNum = idx + 1;
        btn.disabled = true;

        if (optionNum === correctNum) {
          btn.classList.add('correct');
        }
        if (optionNum === selectedNum && selectedNum !== correctNum) {
          btn.classList.add('wrong');
        }
      });

      // Show Explanation immediately
      const expDrawer = document.getElementById('explanation-box');
      document.getElementById('explanation-text').innerText = solution || "No detailed solution text provided for this question.";
      expDrawer.style.display = 'block';
    }

    function nextQuestion() {
      if (currentIndex < activeQuestions.length - 1) {
        currentIndex++;
        renderQuestion(currentIndex);
      } else {
        alert("You have reached the end of this quiz section. Click 'Submit' to evaluate!");
      }
    }

    function confirmSubmit() {
      if (confirm("Are you sure you want to submit your quiz now?")) {
        evaluateResults();
      }
    }

    function evaluateResults() {
      let totalMarks = 0;
      let weakChapters = {};

      activeQuestions.forEach((q, idx) => {
        const selected = userAnswers[idx];
        const correct = parseInt(q.CorrectAnswer);
        const chapter = q.Chapter || "General Concepts";

        if (selected !== undefined) {
          if (selected === correct) {
            totalMarks += 4;
          } else {
            totalMarks -= 1;
            weakChapters[chapter] = (weakChapters[chapter] || 0) + 1;
          }
        }
      });

      document.getElementById('quiz-view').classList.remove('active');
      document.getElementById('result-view').classList.add('active');

      document.getElementById('final-score').innerText = `${totalMarks} / ${activeQuestions.length * 4}`;

      const weakListElem = document.getElementById('weak-list');
      weakListElem.innerHTML = "";

      const weakKeys = Object.keys(weakChapters);
      if (weakKeys.length === 0) {
        weakListElem.innerHTML = "<li>Outstanding accuracy! No major weak chapters detected in attempted questions.</li>";
      } else {
        const fragment = document.createDocumentFragment();
        weakKeys.forEach(chap => {
          const li = document.createElement('li');
          li.innerHTML = `<strong>${chap}</strong> (${weakChapters[chap]} incorrect attempts)`;
          fragment.appendChild(li);
        });
        weakListElem.appendChild(fragment);
      }
    }

    // Initialize on page load
    window.addEventListener('DOMContentLoaded', initQuiz);
  </script>
</body>
</html>
